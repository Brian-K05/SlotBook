services:
  mysql:
    image: mysql:8.4
    container_name: slotbook-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: slotbook
      MYSQL_USER: slotbook
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -psecret || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - slotbook_mysql:/var/lib/mysql

volumes:
  slotbook_mysql:
